name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Extract version from Directory.Build.props
      id: version
      run: |
        VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" Directory.Build.props)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Version from Directory.Build.props: $VERSION"

    - name: Restore local tools
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet restore ManagedCode.Orleans.RateLimiting.sln

    - name: Build
      run: dotnet build ManagedCode.Orleans.RateLimiting.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test --solution ManagedCode.Orleans.RateLimiting.sln --configuration Release --no-build --verbosity normal

    - name: Pack NuGet packages
      run: dotnet pack ManagedCode.Orleans.RateLimiting.sln --configuration Release --no-build -p:IncludeSymbols=false -p:SymbolPackageFormat=snupkg --output ./artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
        retention-days: 5

  publish-nuget:
    name: Publish to NuGet
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ needs.build.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Download artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish to NuGet
      id: publish
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      continue-on-error: true
      run: |
        set +e
        OUTPUT=""
        PUBLISHED=false

        for package in ./artifacts/*.nupkg; do
          echo "Publishing $package..."
          RESULT=$(dotnet nuget push "$package" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate 2>&1)
          EXIT_CODE=$?
          echo "$RESULT"
          OUTPUT="$OUTPUT$RESULT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "Successfully published $package"
            PUBLISHED=true
          elif echo "$RESULT" | grep -q "already exists"; then
            echo "Package already exists, skipping..."
          else
            echo "Failed to publish $package"
            exit 1
          fi
        done

        if [ "$PUBLISHED" = true ] || echo "$OUTPUT" | grep -q "Your package was pushed"; then
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "At least one package was successfully published"
        else
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "No new packages were published (all already exist)"
        fi

  create-release:
    name: Create GitHub Release and Tag
    needs: publish-nuget
    runs-on: ubuntu-latest
    if: needs.publish-nuget.outputs.published == 'true'

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Create and push tag
      id: create_tag
      env:
        VERSION: ${{ needs.publish-nuget.outputs.version }}
      run: |
        TAG="v$VERSION"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists"
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "Creating tag $TAG"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Get previous tag
      id: prev_tag
      env:
        VERSION: ${{ needs.publish-nuget.outputs.version }}
      run: |
        CURRENT_TAG="v$VERSION"
        PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -A1 "^$CURRENT_TAG$" | tail -n1 || echo "")
        if [ "$PREVIOUS_TAG" = "$CURRENT_TAG" ] || [ -z "$PREVIOUS_TAG" ]; then
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^$CURRENT_TAG$" | head -n1 || echo "")
        fi
        echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
        echo "Current tag: $CURRENT_TAG"
        echo "Previous tag: $PREVIOUS_TAG"

    - name: Generate release notes
      id: release_notes
      env:
        VERSION: ${{ needs.publish-nuget.outputs.version }}
        PREVIOUS_TAG: ${{ steps.prev_tag.outputs.previous_tag }}
      run: |
        {
          echo "# Release $VERSION"
          echo ""
          echo "Released on $(date +'%Y-%m-%d')"
          echo ""
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "## 📋 Changes since $PREVIOUS_TAG"
            echo ""
            echo "### ✨ Features"
            git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..HEAD" --grep="^feat" --grep="^feature" || true
            echo ""
            echo "### 🐛 Bug Fixes"
            git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..HEAD" --grep="^fix" --grep="^bugfix" || true
            echo ""
            echo "### 📚 Documentation"
            git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..HEAD" --grep="^docs" --grep="^doc" || true
            echo ""
            echo "### 🔧 Other Changes"
            git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..HEAD" --invert-grep --grep="^feat" --grep="^feature" --grep="^fix" --grep="^bugfix" --grep="^docs" --grep="^doc" || true
            echo ""
          else
            echo "## 🎉 Initial Release"
            echo ""
            echo "### Recent Changes"
            git log --pretty=format:"- %s (%h)" --max-count=20
            echo ""
          fi
          echo ""
          echo "## 📦 NuGet Packages"
          echo ""
          for package in ./artifacts/*.nupkg; do
            PACKAGE_NAME=$(basename "$package" .nupkg)
            BASE_NAME=${PACKAGE_NAME%."$VERSION"}
            echo "- [$BASE_NAME v$VERSION](https://www.nuget.org/packages/$BASE_NAME/$VERSION)"
          done
          echo ""
          echo "---"
          echo "*This release was automatically created by GitHub Actions*"
        } > release_notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.publish-nuget.outputs.version }}
        name: v${{ needs.publish-nuget.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: ./artifacts/*.nupkg
        token: ${{ secrets.GITHUB_TOKEN }}
